name: CI
on:
  # Docs-only changes don't run CI — and because Deploy is triggered by a successful CI run on
  # main, they don't rebuild production either. Anything that can affect the build or the running
  # app (code, lockfile, Dockerfiles, compose, Caddyfile, workflows, scripts) still runs.
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".env.example"
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: plantry, POSTGRES_PASSWORD: plantry, POSTGRES_DB: plantry_test }
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U plantry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://plantry:plantry@localhost:5434/plantry_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plantry/backend exec prisma generate
      - run: pnpm --filter @plantry/backend exec prisma migrate deploy
        env: { DATABASE_URL: "postgres://plantry:plantry@localhost:5434/plantry_test" }
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
